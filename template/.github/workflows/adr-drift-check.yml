name: ADR Drift Check

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC daily
  pull_request:
  workflow_dispatch:

jobs:
  adr-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Choose the report path
        run: echo "ADR_DRIFT_RESULTS_FILE=$RUNNER_TEMP/adr-drift-results.md" >> "$GITHUB_ENV"

      - name: Run ADR drift checks
        id: drift
        run: |
          set +e
          bash tools/adr-verify/runner.sh
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adr-drift-results
          path: ${{ env.ADR_DRIFT_RESULTS_FILE }}
          if-no-files-found: warn

      # PRs from forks get a read-only token and cannot comment. For them the job still fails on drift.
      - name: Comment drift report on PR
        if: >-
          github.event_name == 'pull_request' &&
          steps.drift.outputs.exit_code != '0' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.ADR_DRIFT_RESULTS_FILE;
            if (!fs.existsSync(path)) {
              core.warning('No drift report file to post.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- adr-drift-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const content = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: content });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: content });
            }

      - name: Fail job on drift
        if: steps.drift.outputs.exit_code != '0'
        run: |
          echo "ADR drift check exited with code ${{ steps.drift.outputs.exit_code }}"
          exit 1
